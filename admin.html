<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Админ панел — MEGA HIT MUSIC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128274;</text></svg>">
</head>
<body class="admin-body">

    <!-- ============================================
         LOGIN
         ============================================ -->
    <div id="loginView" class="login-view">
        <div class="login-bg"></div>
        <div class="login-card">
            <div class="login-brand">
                <span class="login-logo">&#127925;</span>
                <div class="login-brand-text">
                    <strong>MEGA HIT <span class="accent">MUSIC</span></strong>
                    <span>Администрация</span>
                </div>
            </div>

            <h1 class="login-title">Вход в панела</h1>
            <p class="login-sub">Въведете вашите данни за достъп</p>

            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="loginUser">Потребителско име</label>
                    <input type="text" id="loginUser" name="username" required
                           autocomplete="username" placeholder="напр. alex4o" spellcheck="false">
                </div>
                <div class="form-group">
                    <label for="loginPass">Парола</label>
                    <div class="password-wrap">
                        <input type="password" id="loginPass" name="password" required
                               autocomplete="current-password" placeholder="••••••••">
                        <button type="button" class="password-toggle" id="togglePass" aria-label="Покажи паролата">&#128065;</button>
                    </div>
                </div>

                <div id="loginError" class="login-error" hidden></div>

                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    Влез
                </button>
            </form>

            <div class="login-footer">
                <a href="index.html">&#8592; Обратно към сайта</a>
            </div>
        </div>
    </div>

    <!-- ============================================
         ADMIN APP
         ============================================ -->
    <div id="adminView" class="admin-view" hidden>

        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="sidebar-brand">
                <span class="login-logo">&#127925;</span>
                <div class="login-brand-text">
                    <strong>MEGA HIT <span class="accent">MUSIC</span></strong>
                    <span>Админ панел</span>
                </div>
            </div>

            <nav class="sidebar-nav" id="sidebarNav">
                <button class="sidebar-link active" data-panel="dashboard">
                    <span class="sidebar-icon">&#128202;</span> Табло
                </button>
                <button class="sidebar-link" data-panel="artists">
                    <span class="sidebar-icon">&#127908;</span> Изпълнители
                </button>
                <button class="sidebar-link" data-panel="singles">
                    <span class="sidebar-icon">&#127925;</span> Сингли
                </button>
                <button class="sidebar-link" data-panel="events">
                    <span class="sidebar-icon">&#127915;</span> Събития
                </button>
                <button class="sidebar-link" data-panel="news">
                    <span class="sidebar-icon">&#128240;</span> Новини
                </button>

                <div class="sidebar-divider"></div>
                <div class="sidebar-group-label">Академия</div>
                <button class="sidebar-link" data-panel="academySettings">
                    <span class="sidebar-icon">&#127891;</span> Настройки
                </button>
                <button class="sidebar-link" data-panel="academyCourses">
                    <span class="sidebar-icon">&#128218;</span> Дисциплини
                </button>
                <button class="sidebar-link" data-panel="academyPlans">
                    <span class="sidebar-icon">&#128179;</span> Цени
                </button>

                <div class="sidebar-divider"></div>
                <button class="sidebar-link" data-panel="messages">
                    <span class="sidebar-icon">&#9993;</span> Съобщения
                    <span class="badge" id="msgBadge" hidden>0</span>
                </button>
                <button class="sidebar-link" data-panel="users" data-admin-only="true">
                    <span class="sidebar-icon">&#128100;</span> Потребители
                </button>
                <button class="sidebar-link" data-panel="account">
                    <span class="sidebar-icon">&#9881;</span> Моят профил
                </button>
            </nav>

            <div class="sidebar-footer">
                <a href="index.html" class="sidebar-site-link" target="_blank" rel="noopener">
                    &#128279; Отвори сайта
                </a>
                <button class="sidebar-logout" id="logoutBtn">&#128682; Изход</button>
            </div>
        </aside>

        <!-- Main -->
        <main class="admin-main">
            <header class="admin-topbar">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="Меню">&#9776;</button>
                <div class="topbar-title" id="topbarTitle">Табло</div>
                <div class="topbar-user">
                    <div class="topbar-avatar" id="userAvatar">A</div>
                    <div class="topbar-user-info">
                        <strong id="userName">—</strong>
                        <span id="userRole">—</span>
                    </div>
                </div>
            </header>

            <div class="admin-content" id="panelContent">
                <!-- Panels rendered by JS -->
            </div>
        </main>
    </div>

    <!-- Modal root -->
    <div id="modalRoot"></div>
    <!-- Toast root -->
    <div id="toastRoot" class="toast-root"></div>

    <!-- Scripts -->
    <script type="module" src="js/firebase-config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
